name: Cross-platform HGD

on:
  push:
    branches:
      - main
      - 'agent/v0.4-*'
  pull_request:

jobs:
  core-workspace:
    name: Core workspace / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HGD web and test dependencies
        run: python -m pip install -e ".[web,dev]"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  full-scientific-hgd:
    name: Full HGD + PyRosetta / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full HGD is native on Linux/macOS. Windows full support is via WSL2,
        # because PyRosetta is distributed for Windows through its Linux layer.
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the shipped HGD Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: human-guided-protein-design
          environment-file: environment.yml
          auto-activate-base: false

      - name: Verify PyRosetta is installed
        run: python -c "import pyrosetta; print(pyrosetta.__version__)"

      - name: Run the complete Python test suite
        run: python -m pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
