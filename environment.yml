name: human-guided-protein-design

channels:
  - conda-forge
  - https://conda.rosettacommons.org

dependencies:
  # HGD runtime
  - python=3.11
  - pip

  # Core scientific evaluator
  - pyrosetta

  # Frontend development/build
  - nodejs>=20

  # HGD Python package, local web API, and test tooling
  - pip:
      - -e .[web,dev]

# PyMOL is intentionally NOT pinned here.
# HGD discovers and uses the scientist's existing local PyMOL installation,
# whether licensed Incentive PyMOL or open-source PyMOL. If none is installed,
# one free option is:
#   conda install -c conda-forge pymol-open-source
# A specific executable can be selected with HGD_PYMOL.
#
# Full HGD support targets:
#   Linux   - native
#   macOS   - native
#   Windows - WSL2 (PyRosetta's supported Windows route)
