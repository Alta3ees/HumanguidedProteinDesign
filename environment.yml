name: human-guided-protein-design

channels:
  - conda-forge
  - https://conda.rosettacommons.org

dependencies:
  # HGD runtime
  - python=3.11
  - pip

  # Core scientific evaluator
  - pyrosetta

  # Default local structure viewer
  # Licensed Incentive PyMOL users can override this executable with HGD_PYMOL.
  - pymol-open-source

  # Frontend development/build
  - nodejs>=20

  # HGD Python package, local web API, and test tooling
  - pip:
      - -e .[web,dev]

# PyMOL policy
# ------------
# The default environment includes open-source PyMOL so the structure-viewer
# button works immediately after environment creation. Scientists who already
# have licensed Incentive PyMOL can point HGD to that executable instead:
#
#   Linux/macOS: export HGD_PYMOL=/absolute/path/to/pymol
#   Windows/WSL: export HGD_PYMOL=/path/to/the/desired/pymol
#
# HGD does not inspect or manage PyMOL licensing; it simply launches the
# configured/discovered executable.
#
# Full HGD support targets:
#   Linux   - native
#   macOS   - native
#   Windows - WSL2 (PyRosetta's supported Windows route)
