name: human-guided-protein-design
channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - nodejs>=20
  - pip:
      - -e .[web,dev]

# Optional scientific tools
# -------------------------
# PyMOL is intentionally optional. HGD discovers and uses an existing local
# licensed or open-source PyMOL installation. If none is installed, one free
# option is:
#   conda install -c conda-forge pymol-open-source
# You may explicitly select an executable with HGD_PYMOL.
#
# PyRosetta is intentionally optional because its distribution/platform support
# is separate from normal conda-forge/PyPI packaging. The archive, web UI,
# evidence management, structure management, and provenance workflow run without
# PyRosetta. PyRosetta-specific tests skip automatically when it is unavailable.
