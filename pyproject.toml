[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "human-protein-design"
version = "0.4.0.dev0"
description = "Human-guided protein design with scientific provenance and an interactive research workspace"
requires-python = ">=3.11"

[project.optional-dependencies]
web = ["fastapi", "uvicorn", "httpx", "python-multipart", "openpyxl"]
dev = ["pytest"]

[project.scripts]
hgd = "human_protein_design.web.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
